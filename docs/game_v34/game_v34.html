const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"game_v34","experimentalVK":false,"fileSizes":{"game_v34.pck":11191912,"game_v34.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
// Single-threaded build: never install COOP/COEP service worker (can hang iOS loads).
GODOT_CONFIG.ensureCrossOriginIsolationHeaders = false;
GODOT_CONFIG.serviceWorker = null;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadSub = document.getElementById('load-sub');
	const loadBytes = document.getElementById('load-bytes');
	const retryBtn = document.getElementById('retry-btn');

	let initializing = true;
	let statusMode = '';
	let lastProgressAt = Date.now();
	let lastCurrent = 0;
	let stallTimer = null;
	let started = false;

	function mb(n) {
		return (n / (1024 * 1024)).toFixed(1);
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			if (stallTimer) clearInterval(stallTimer);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = (mode === 'progress') ? 'block' : 'none';
		statusNotice.style.display = (mode === 'notice') ? 'block' : 'none';
		if (mode !== 'notice') {
			retryBtn.style.display = 'none';
		}
		statusMode = mode;
	}

	function setStatusNotice(text) {
		statusNotice.textContent = text;
	}

	function zhError(err) {
		let msg = '';
		if (err instanceof Error) msg = err.message || String(err);
		else if (typeof err === 'string') msg = err;
		else msg = '未知错误';
		if (/webgl|WebGL|context/i.test(msg)) {
			return 'WebGL 初始化失败（设备或浏览器不支持）。\n' + msg;
		}
		if (/memory|OOM|out of memory|Array buffer/i.test(msg)) {
			return '内存不足，无法加载。请关闭其他 App 后重试。\n' + msg;
		}
		if (/Failed to fetch|NetworkError|Load failed|download/i.test(msg)) {
			return '网络下载失败。请检查网络后重试。\n' + msg;
		}
		return '加载失败：\n' + msg;
	}

	function displayFailureNotice(err) {
		console.error(err);
		loadSub.textContent = '加载失败';
		loadBytes.textContent = '';
		setStatusNotice(zhError(err));
		setStatusMode('notice');
		retryBtn.style.display = 'inline-block';
		retryBtn.textContent = '点此重试';
		initializing = false;
		if (stallTimer) clearInterval(stallTimer);
	}

	function showStallRetry() {
		if (!initializing || statusMode === 'notice') return;
		loadSub.textContent = '网络较慢';
		retryBtn.style.display = 'inline-block';
		retryBtn.textContent = '网络较慢，点此重试';
	}

	function boot() {
		if (started) return;
		started = true;
		lastProgressAt = Date.now();
		setStatusMode('progress');
		loadSub.textContent = '正在加载…';
		retryBtn.style.display = 'none';
		stallTimer = setInterval(function () {
			if (!initializing) return;
			if (Date.now() - lastProgressAt > 15000) {
				showStallRetry();
			}
		}, 1000);

		engine.startGame({
			onProgress: function (current, total) {
				if (current > lastCurrent) {
					lastProgressAt = Date.now();
					lastCurrent = current;
					if (retryBtn.style.display !== 'none' && statusMode === 'progress') {
						retryBtn.style.display = 'none';
						loadSub.textContent = '正在加载…';
					}
				}
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					loadBytes.textContent = mb(current) + ' MB / ' + mb(total) + ' MB';
				} else if (current > 0) {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadBytes.textContent = '已下载 ' + mb(current) + ' MB…';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadBytes.textContent = '连接中…';
				}
			},
		}).then(function () {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}

	retryBtn.addEventListener('click', function () {
		window.location.reload();
	});

	window.addEventListener('error', function (ev) {
		if (!initializing) return;
		displayFailureNotice(ev.error || ev.message || '页面脚本错误');
	});
	window.addEventListener('unhandledrejection', function (ev) {
		if (!initializing) return;
		displayFailureNotice(ev.reason || 'Promise 被拒绝');
	});

	var swReady = Promise.resolve();
	if ('serviceWorker' in navigator) {
		swReady = navigator.serviceWorker.getRegistrations().then(function (regs) {
			return Promise.all(regs.map(function (r) { return r.unregister(); }));
		}).catch(function () {});
	}

	swReady.then(function () {
		const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length !== 0) {
			displayFailureNotice('当前浏览器缺少运行所需功能：\n' + missing.join('\n'));
			return;
		}
		boot();
	});
}());
